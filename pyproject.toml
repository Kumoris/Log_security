[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlog-unified"
version = "0.9.1"
description = "Unified PyDriller log privacy screening, history tracking and human review"
requires-python = ">=3.11"
dependencies = ["PyDriller==2.11", "PyYAML==6.0.2", "jsonschema==4.23.0", "Pygments==2.21.0", "tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2", "tree-sitter-go==0.25.0", "tree-sitter-java==0.23.5"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
aidev = ["pyarrow==21.0.0"]

[project.scripts]
agentlog-unified = "agentlog_unified.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
